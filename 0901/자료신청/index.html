    <!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>교육자료신청</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR",
                   "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 520px;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 34px 28px 30px;
      box-shadow: 0 14px 40px rgba(31, 50, 81, 0.10);
    }

    .logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 18px;
      border-radius: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1f6feb;
      color: #fff;
      font-size: 27px;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 27px;
      line-height: 1.35;
      letter-spacing: -0.7px;
    }

    .subtitle {
      margin: 9px 0 30px;
      text-align: center;
      color: #697386;
      font-size: 14px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #dce2ea;
      border-radius: 13px;
      padding: 14px 15px;
      outline: none;
      background: #fbfcfe;
      color: #172033;
      font-size: 15px;
      font-family: inherit;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }

    input {
      height: 50px;
    }

    textarea {
      min-height: 125px;
      resize: vertical;
      line-height: 1.55;
    }

    input:focus,
    textarea:focus {
      border-color: #1f6feb;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(31, 111, 235, 0.10);
    }

    .button {
      width: 100%;
      height: 54px;
      margin-top: 7px;
      border: 0;
      border-radius: 14px;
      background: #1f6feb;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      transition: transform .1s, opacity .2s;
    }

    .button:active {
      transform: scale(.99);
    }

    .button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .error {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 11px;
      background: #fff1f1;
      color: #c62828;
      font-size: 13px;
      line-height: 1.5;
    }

    .success-screen {
      display: none;
      text-align: center;
      padding: 30px 10px 15px;
    }

    .success-icon {
      width: 74px;
      height: 74px;
      margin: 0 auto 22px;
      border-radius: 50%;
      background: #eaf7ef;
      color: #249a58;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 37px;
      font-weight: 800;
    }

    .success-screen h2 {
      margin: 0;
      font-size: 25px;
      line-height: 1.45;
      letter-spacing: -0.7px;
    }

    .success-screen p {
      margin: 12px 0 0;
      color: #697386;
      font-size: 14px;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      body {
        padding: 15px;
        align-items: flex-start;
        padding-top: 35px;
      }

      .card {
        padding: 29px 20px 24px;
        border-radius: 20px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="card">

      <div id="formScreen">
        <div class="logo">교</div>

        <h1>교육자료신청</h1>
        <p class="subtitle">
          교육자료를 받기 위해 아래 내용을 입력해주세요.
        </p>

        <form id="applicationForm">
          <div class="field">
            <label for="name">이름</label>
            <input
              id="name"
              name="name"
              type="text"
              placeholder="이름을 입력해주세요"
              autocomplete="name"
              required
            >
          </div>

          <div class="field">
            <label for="email">이메일</label>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="이메일을 입력해주세요"
              autocomplete="email"
              required
            >
          </div>

          <div class="field">
            <label for="message">교수님께 하고 싶은 말</label>
            <textarea
              id="message"
              name="message"
              placeholder="교수님께 전하고 싶은 말을 자유롭게 입력해주세요."
            ></textarea>
          </div>

          <button id="submitButton" class="button" type="submit">
            확인
          </button>

          <div id="errorMessage" class="error"></div>
        </form>
      </div>

      <div id="successScreen" class="success-screen">
        <div class="success-icon">✓</div>
        <h2>오늘 교육 받느라<br>수고하셨습니다.</h2>
        <p>신청이 정상적으로 접수되었습니다.</p>
      </div>

    </section>
  </main>

  <script>
    const form = document.getElementById('applicationForm');
    const submitButton = document.getElementById('submitButton');
    const errorMessage = document.getElementById('errorMessage');
    const formScreen = document.getElementById('formScreen');
    const successScreen = document.getElementById('successScreen');

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      errorMessage.style.display = 'none';
      submitButton.disabled = true;
      submitButton.textContent = '저장 중...';

      const data = {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        message: document.getElementById('message').value.trim()
      };

      google.script.run
        .withSuccessHandler(function (result) {
          if (result && result.success) {
            formScreen.style.display = 'none';
            successScreen.style.display = 'block';
          } else {
            showError('신청 처리 중 문제가 발생했습니다.');
          }
        })
        .withFailureHandler(function (error) {
          showError(error && error.message
            ? error.message
            : '신청 처리 중 문제가 발생했습니다.');
        })
        .submitApplication(data);
    });

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.style.display = 'block';
      submitButton.disabled = false;
      submitButton.textContent = '확인';
    }
  </script>
</body>
</html>

  </body>
</html>
