<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Smart QR</title>
<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap');

:root{
  --mx:50%;
  --my:35%;
  --c1:#eef4ff;
  --c2:#f7efff;
  --c3:#fff7ed;
  --ink:#1b2433;
  --sub:#778297;
  --blue:#5d72ff;
  --blue2:#8b7dff;
  --line:#ffffff;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family:"DM Sans","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at var(--mx) var(--my), rgba(255,255,255,.98) 0 8%, rgba(255,255,255,.35) 22%, transparent 45%),
    radial-gradient(circle at 10% 8%, var(--c1), transparent 38%),
    radial-gradient(circle at 92% 18%, var(--c2), transparent 35%),
    radial-gradient(circle at 55% 100%, var(--c3), transparent 40%),
    #fafbfe;
  transition:background .5s ease;
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  width:420px;height:420px;
  left:calc(var(--mx) - 210px);
  top:calc(var(--my) - 210px);
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.35),transparent 68%);
  filter:blur(8px);
  pointer-events:none;
  z-index:-1;
  transition:left .55s ease,top .55s ease;
}

body:after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:linear-gradient(120deg,rgba(255,255,255,.22),transparent 40%,rgba(255,255,255,.18));
  z-index:-1;
}

.app{
  width:min(100%,900px);
  min-height:100vh;
  margin:auto;
  padding:22px 24px 30px;
  display:flex;
  flex-direction:column;
}

header{
  height:66px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  width:142px;
  max-height:54px;
  object-fit:contain;
  filter:drop-shadow(0 5px 12px rgba(57,72,130,.08));
}

.brand{
  font-size:17px;
  font-weight:700;
  letter-spacing:.08em;
  color:#59647a;
}

.brand span{
  display:inline-block;
  margin-left:7px;
  width:7px;height:7px;
  border-radius:50%;
  background:linear-gradient(135deg,#6478ff,#a58cff);
  box-shadow:0 0 13px rgba(100,120,255,.45);
}

.workspace{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:30px 0 65px;
  transition:.55s cubic-bezier(.2,.8,.2,1);
}

.workspace.result{
  justify-content:flex-start;
  padding-top:clamp(30px,8vh,80px);
}

.intro{
  text-align:center;
  margin-bottom:28px;
}

.eyebrow{
  display:inline-block;
  padding:7px 12px;
  border-radius:999px;
  background:rgba(255,255,255,.62);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 8px 24px rgba(74,88,145,.08);
  font-size:10px;
  font-weight:700;
  letter-spacing:.16em;
  color:#6475d9;
  margin-bottom:14px;
}

.intro h1{
  font-size:clamp(31px,6vw,46px);
  line-height:1.1;
  letter-spacing:-.06em;
  margin:0 0 13px;
  background:linear-gradient(110deg,#27334b,#6377ff 48%,#947cff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.intro p{
  font-size:14px;
  color:var(--sub);
  margin:0;
  line-height:1.7;
}

.form-wrap{
  width:min(92vw,620px);
  position:relative;
  z-index:3;
  transition:.55s;
}

.workspace.result .form-wrap{margin-top:30px}

.url-form{
  display:flex;
  align-items:center;
  gap:8px;
  background:rgba(255,255,255,.76);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  padding:8px;
  border:1px solid rgba(255,255,255,.95);
  border-radius:22px;
  box-shadow:
    0 25px 70px rgba(78,94,160,.12),
    0 5px 18px rgba(78,94,160,.07),
    inset 0 1px 0 rgba(255,255,255,.9);
}

.url-form:focus-within{
  box-shadow:
    0 25px 75px rgba(91,113,255,.17),
    0 0 0 4px rgba(112,126,255,.08),
    inset 0 1px 0 rgba(255,255,255,.95);
}

.url-form input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  height:52px;
  padding:0 16px;
  font-size:15px;
  color:var(--ink);
}

.url-form input::placeholder{color:#a7afbd}

.url-form button{
  border:0;
  height:52px;
  padding:0 24px;
  border-radius:15px;
  background:linear-gradient(135deg,#6176ff 0%,#817fff 48%,#a17fe9 100%);
  color:#fff;
  font-weight:700;
  font-size:14px;
  box-shadow:0 10px 25px rgba(100,116,255,.28);
  cursor:pointer;
  transition:transform .2s,box-shadow .2s,filter .2s;
}

.url-form button:hover{
  transform:translateY(-2px);
  filter:saturate(1.08);
  box-shadow:0 14px 31px rgba(100,116,255,.34);
}

.url-form button:active{transform:scale(.98)}

.qr-panel{
  order:2;
  width:min(76vw,390px);
  aspect-ratio:1;
  background:rgba(255,255,255,.86);
  border:11px solid rgba(255,255,255,.92);
  border-radius:31px;
  box-shadow:
    0 35px 95px rgba(61,77,139,.16),
    0 7px 25px rgba(61,77,139,.08);
  display:none;
  align-items:center;
  justify-content:center;
  position:relative;
  cursor:pointer;
  animation:qrIn .55s both;
}

.qr-panel.show{display:flex}

.qr-panel canvas{
  width:100%!important;
  height:100%!important;
  display:block;
  border-radius:12px;
}

.qr-label{
  position:absolute;
  bottom:-43px;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  color:#707b91;
  font-size:11px;
  background:rgba(255,255,255,.88);
  border:1px solid rgba(255,255,255,.95);
  padding:7px 13px;
  border-radius:999px;
  box-shadow:0 8px 25px rgba(57,72,130,.1);
}

.result-info{
  order:4;
  width:min(92vw,620px);
  display:none;
  text-align:center;
  margin-top:58px;
}

.result-info.show{
  display:block;
  animation:fadeUp .45s .08s both;
}

.url-text{
  font-size:12px;
  color:#8992a4;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin:0 auto 13px;
  max-width:500px;
}

.action-btn{
  border:1px solid rgba(255,255,255,.95);
  background:rgba(255,255,255,.72);
  color:#4c5870;
  border-radius:12px;
  padding:10px 15px;
  font-size:12px;
  font-weight:600;
  margin:2px;
  cursor:pointer;
  box-shadow:0 5px 16px rgba(67,82,138,.06);
  transition:.2s;
}

.action-btn:hover{
  transform:translateY(-1px);
  background:#fff;
  box-shadow:0 9px 22px rgba(67,82,138,.1);
}

footer{
  text-align:center;
  color:#a1a9b8;
  font-size:10px;
  letter-spacing:.08em;
  padding-top:8px;
}

@keyframes qrIn{
  from{opacity:0;transform:translateY(22px) scale(.93)}
  to{opacity:1;transform:none}
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}

@media(max-width:560px){
  .app{padding:12px 14px 24px}
  header{height:58px}
  .logo{width:122px}
  .brand{font-size:14px}
  .workspace{padding-top:16px}
  .workspace.result{padding-top:30px}
  .intro{margin-bottom:22px}
  .eyebrow{font-size:9px;padding:6px 10px}
  .intro h1{font-size:29px}
  .intro p{font-size:13px}
  .url-form{padding:7px;border-radius:19px}
  .url-form input{height:48px;padding:0 11px;font-size:14px}
  .url-form button{height:48px;padding:0 17px;border-radius:13px;font-size:13px}
  .qr-panel{width:min(84vw,350px);border-width:8px;border-radius:25px}
  .qr-label{font-size:10px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <img class="logo" src="logo.png" alt="Smart QR" onerror="this.style.display='none'">
  <div class="brand">Smart QR<span></span></div>
</header>

<main class="workspace" id="workspace">
<section class="intro">
  <div class="eyebrow">SIMPLE · FAST · SMART</div>
  <h1>URL을 QR코드로</h1>
  <p>링크를 입력하면 깔끔한 QR코드를 바로 만들어 드립니다.</p>
</section>

<div class="qr-panel" id="qrPanel" title="클릭하면 JPG로 저장됩니다.">
  <canvas id="qrCanvas" width="800" height="800"></canvas>
  <div class="qr-label">QR코드를 클릭하면 JPG로 저장됩니다</div>
</div>

<div class="form-wrap">
<form class="url-form" id="form">
<input id="url" type="url" inputmode="url" autocomplete="url" placeholder="https://example.com" required>
<button type="submit">QR 생성</button>
</form>
</div>

<div class="result-info" id="info">
<div class="url-text" id="urlText"></div>
<button class="action-btn" id="copy" type="button">URL 복사</button>
<button class="action-btn" id="new" type="button">새 QR 만들기</button>
</div>
</main>

<footer>SMART QR · QR CODE GENERATOR</footer>
</div>

<script>
const ws=document.getElementById('workspace');
const form=document.getElementById('form');
const input=document.getElementById('url');
const panel=document.getElementById('qrPanel');
const canvas=document.getElementById('qrCanvas');
const info=document.getElementById('info');
const text=document.getElementById('urlText');
let current='';

function normalize(v){
  v=v.trim();
  return /^https?:\/\//i.test(v)?v:'https://'+v;
}

/* 마우스 위치에 따라 배경의 빛과 그라데이션 위치를 부드럽게 이동 */
let raf=0;
document.addEventListener('mousemove',e=>{
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(()=>{
    const x=(e.clientX/window.innerWidth)*100;
    const y=(e.clientY/window.innerHeight)*100;
    document.documentElement.style.setProperty('--mx',x+'%');
    document.documentElement.style.setProperty('--my',y+'%');
  });
});

/* 터치 환경에서는 은은한 고정 효과 유지 */
document.addEventListener('touchmove',e=>{
  const t=e.touches[0];
  if(!t)return;
  document.documentElement.style.setProperty('--mx',(t.clientX/window.innerWidth*100)+'%');
  document.documentElement.style.setProperty('--my',(t.clientY/window.innerHeight*100)+'%');
},{passive:true});

form.addEventListener('submit',e=>{
  e.preventDefault();
  if(typeof QRious==='undefined'){
    alert('QR 생성 기능을 불러오지 못했습니다. 인터넷 연결을 확인해주세요.');
    return;
  }
  const u=normalize(input.value);
  if(!u)return;

  current=u;
  new QRious({
    element:canvas,
    value:u,
    size:800,
    level:'H',
    background:'#fff',
    foreground:'#111',
    padding:34
  });

  text.textContent=u;
  panel.classList.add('show');
  info.classList.add('show');
  ws.classList.add('result');

  setTimeout(()=>{
    panel.scrollIntoView({behavior:'smooth',block:'center'});
  },160);
});

panel.addEventListener('click',()=>{
  if(!current)return;
  const a=document.createElement('a');
  a.href=canvas.toDataURL('image/jpeg',.96);
  a.download='smart-qr.jpg';
  document.body.appendChild(a);
  a.click();
  a.remove();
});

document.getElementById('copy').onclick=async()=>{
  try{
    await navigator.clipboard.writeText(current);
    const b=document.getElementById('copy');
    b.textContent='복사 완료 ✓';
    setTimeout(()=>b.textContent='URL 복사',1300);
  }catch(e){alert(current)}
};

document.getElementById('new').onclick=()=>{
  current='';
  panel.classList.remove('show');
  info.classList.remove('show');
  ws.classList.remove('result');
  input.value='';
  input.focus();
  scrollTo({top:0,behavior:'smooth'});
};
</script>
</body>
</html>
